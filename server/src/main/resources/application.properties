server.port=${SERVER_PORT:9090}
server.address=${SERVER_ADDRESS:127.0.0.1}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/videorag?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf-8&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:videorag}
spring.datasource.password=${DB_PASSWORD:videorag123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=3000
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.slf4j.Slf4jImpl
mybatis-plus.global-config.db-config.id-type=auto
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=0

# Upload
spring.servlet.multipart.max-file-size=64MB
spring.servlet.multipart.max-request-size=64MB
app.upload.chunk-size=${UPLOAD_CHUNK_SIZE:8388608}
app.upload.session-ttl-hours=${UPLOAD_SESSION_TTL_HOURS:24}

# AI gateway (SiliconFlow, OpenAI compatible)
ai.base-url=${SILICONFLOW_BASE_URL:https://api.siliconflow.cn/v1}
ai.api-key=${SILICONFLOW_API_KEY:}
ai.chat-model=${CHAT_MODEL:deepseek-ai/DeepSeek-V3.2}
ai.chat-timeout-seconds=${CHAT_TIMEOUT_SECONDS:300}
ai.embedding-model=${EMBEDDING_MODEL:BAAI/bge-m3}
ai.rerank-model=${RERANK_MODEL:BAAI/bge-reranker-v2-m3}
ai.asr-url=${ASR_URL:${SILICONFLOW_BASE_URL:https://api.siliconflow.cn/v1}/audio/transcriptions}
ai.asr-model=${ASR_MODEL:FunAudioLLM/SenseVoiceSmall}
ai.asr-segment-seconds=${ASR_SEGMENT_SECONDS:60}

# Vector store
vector.qdrant.enabled=${QDRANT_ENABLED:true}
vector.qdrant.url=${QDRANT_URL:http://localhost:6333}
vector.qdrant.collection=${QDRANT_COLLECTION:video_chunks}

# Elasticsearch keyword channel
rag.es.enabled=${ES_ENABLED:true}
rag.es.url=${ES_URL:http://localhost:9200}
rag.es.index=${ES_INDEX:video_knowledge}
rag.es.top-k=${ES_TOP_K:20}

# Hybrid retrieval
rag.rrf-k=${RRF_K:20}
rag.candidate-limit=${RAG_CANDIDATE_LIMIT:30}
rag.top-k=${RAG_TOP_K:8}
rag.rerank-enabled=${RERANK_ENABLED:true}
rag.rerank-min-score=${RERANK_MIN_SCORE:0}

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.password=${REDIS_PASSWORD:videorag123}
spring.data.redis.timeout=3000ms

# MinIO
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:videorag}
minio.secret-key=${MINIO_SECRET_KEY:videorag123}
minio.bucket=${MINIO_BUCKET:videorag}

# Local media tools
tool.ffmpeg-dir=${FFMPEG_DIR:}
tool.ffprobe-path=${FFPROBE_PATH:ffprobe}
tool.ocr-command=${OCR_COMMAND:tesseract}
tool.tessdata-dir=${TESSDATA_PREFIX:}

# RocketMQ
rocketmq.name-server=${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
rocketmq.producer.group=${ROCKETMQ_PRODUCER_GROUP:videorag-producer}
rocketmq.producer.send-message-timeout=3000
rocketmq.topic.pipeline=${ROCKETMQ_PIPELINE_TOPIC:videorag-pipeline}
rocketmq.consumer.group=${ROCKETMQ_CONSUMER_GROUP:videorag-pipeline-consumer}

# Rate limiting
app.limit.ai.user-per-minute=${AI_USER_RPM:20}
app.limit.ai.global-per-minute=${AI_GLOBAL_RPM:60}

# Redis token bucket per user: capacity = burst, refill-per-second = continuous refill
app.rate-limit.upload-precheck.capacity=30
app.rate-limit.upload-precheck.refill-per-second=5
app.rate-limit.upload-init.capacity=10
app.rate-limit.upload-init.refill-per-second=2
app.rate-limit.upload-part.capacity=200
app.rate-limit.upload-part.refill-per-second=50
app.rate-limit.upload-complete.capacity=10
app.rate-limit.upload-complete.refill-per-second=1
app.rate-limit.rag-chat.capacity=10
app.rate-limit.rag-chat.refill-per-second=0.5
app.rate-limit.analysis-route.capacity=10
app.rate-limit.analysis-route.refill-per-second=0.5
app.rate-limit.analysis-run.capacity=5
app.rate-limit.analysis-run.refill-per-second=0.1

# Optional admin bootstrap
app.admin.username=${ADMIN_USERNAME:}
app.admin.password=${ADMIN_PASSWORD:}

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
spring.mvc.async.request-timeout=300000
